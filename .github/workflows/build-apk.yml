name: Build Mechastron Android APK

on:
  push:
    branches: [ "main", "feat/*" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Native Engine & Android Studio APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;26.1.10909125"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Run Engine Tests
        run: cargo test --all-targets --release

      - name: Build Native Rust Engine (.so) for Android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
        run: |
          mkdir -p android/app/src/main/jniLibs
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o android/app/src/main/jniLibs build --release

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android Debug APK
        working-directory: android
        run: |
          gradle assembleDebug --stacktrace

      - name: Upload Mechastron APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mechastron-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
