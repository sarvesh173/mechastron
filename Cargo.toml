[package]
name = "mechastron"
version = "0.1.0"
edition = "2021"
description = "Mechastron: High-performance clean-room motion graphics engine & studio"
license = "MIT"
authors = ["Sarvesh <sarvesh173>", "Alya <alisa@kujou.ai>"]

[lib]
name = "mechastron"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[dependencies]
zip = { version = "2.2", default-features = false, features = ["deflate"] }
quick-xml = { version = "0.37", features = ["serialize"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
tempfile = "3.17"
